<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metinden Sese</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --border: #e1e5ee;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1420;
        --card: #171d2b;
        --text: #e6e9f2;
        --muted: #8e97ab;
        --border: #262e41;
        --accent: #6366f1;
        --accent-hover: #818cf8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header { margin-bottom: 1.5rem; }
    header h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.02em; }
    header p { margin: 0.25rem 0 0; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: 0.9rem 1rem;
      font: inherit;
      line-height: 1.5;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus, select:focus { border-color: var(--accent); }
    .meta-line {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .counter.over { color: var(--err); font-weight: 600; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-top: 1rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 150px; }
    .field label { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    select {
      font: inherit;
      padding: 0.55rem 0.7rem;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    .spacer { flex: 1; }
    button.primary {
      font: inherit;
      font-weight: 600;
      padding: 0.7rem 1.4rem;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
    button.ghost {
      font: inherit;
      padding: 0.55rem 1rem;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
    }
    .status-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: var(--border);
    }
    .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .pill.loading::before, .pill.running::before { background: var(--accent); animation: pulse 1s infinite; }
    .pill.done::before { background: var(--ok); }
    .pill.error::before { background: var(--err); }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .progress {
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin: 1rem 0 0.6rem;
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      transition: width 0.4s ease;
    }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .stat { background: var(--bg); border-radius: 10px; padding: 0.7rem 0.9rem; }
    .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .value { font-size: 1.1rem; font-weight: 600; margin-top: 0.15rem; }
    .error-box { color: var(--err); margin-top: 0.9rem; font-size: 0.95rem; }
    audio { width: 100%; margin-top: 1rem; }
    .actions { display: flex; gap: 0.6rem; margin-top: 0.8rem; flex-wrap: wrap; }
    .actions a { text-decoration: none; }
    .hidden { display: none !important; }
    h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .history-item:first-of-type { border-top: none; }
    .history-item .muted { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Metinden Sese</h1>
      <p>Yerelde, ücretsiz metinden sese dönüştürme</p>
    </header>

    <section class="card">
      <textarea id="text" placeholder="Seslendirmek istediğiniz metni yazın..."></textarea>
      <div class="meta-line">
        <span id="counter" class="counter"></span>
        <span>Ctrl + Enter ile üret</span>
      </div>

      <div class="controls">
        <div class="field">
          <label for="lang">Dil</label>
          <select id="lang"></select>
        </div>
        <div class="field">
          <label for="engine">Motor</label>
          <select id="engine"></select>
        </div>
        <div class="spacer"></div>
        <button id="speak" class="primary">Üret</button>
      </div>
    </section>

    <section id="status-card" class="card hidden">
      <div class="status-head">
        <span id="pill" class="pill">Hazırlanıyor</span>
        <span id="device" class="meta-line" style="margin:0"></span>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="progress-text">
        <span id="progress-label">0 / 0 parça</span>
        <span id="percent">%0</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">Geçen süre</div><div class="value" id="elapsed">-</div></div>
        <div class="stat"><div class="label">Tahmini kalan</div><div class="value" id="remaining">-</div></div>
        <div class="stat"><div class="label">Motor</div><div class="value" id="engine-name">-</div></div>
        <div class="stat"><div class="label">Dil</div><div class="value" id="lang-name">-</div></div>
      </div>
      <div id="error" class="error-box hidden"></div>
      <audio id="player" controls class="hidden"></audio>
      <div id="actions" class="actions hidden">
        <a id="download" class="ghost" download>WAV indir</a>
      </div>
    </section>

    <section id="history-card" class="card hidden">
      <h2>Bu oturumda üretilenler</h2>
      <div id="history"></div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const STATUS_TEXT = {
      queued: "Sırada bekliyor",
      loading: "Model yükleniyor",
      running: "Üretiliyor",
      done: "Tamamlandı",
      error: "Hata",
    };

    let maxTextLength = 50000;
    let languages = {};
    let activeJobId = null;
    let timer = null;
    const history = [];

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return "-";
      const s = Math.max(0, Math.round(seconds));
      const m = Math.floor(s / 60);
      const r = String(s % 60).padStart(2, "0");
      return m > 0 ? `${m} dk ${r} sn` : `${r} sn`;
    }

    function updateCounter() {
      const length = $("text").value.length;
      const counter = $("counter");
      counter.textContent = `${length.toLocaleString("tr-TR")} / ${maxTextLength.toLocaleString("tr-TR")} karakter`;
      counter.classList.toggle("over", length > maxTextLength);
    }

    async function loadOptions() {
      const [langs, engines] = await Promise.all([
        fetch("/api/languages").then((r) => r.json()),
        fetch("/api/engines").then((r) => r.json()),
      ]);
      for (const l of langs) {
        languages[l.code] = l.name;
        $("lang").add(new Option(l.name, l.code));
      }
      for (const name of engines.engines) {
        $("engine").add(new Option(name === "xtts" ? "XTTS v2 (doğal)" : "Piper (hızlı)", name));
      }
      maxTextLength = engines.max_text_length;
      $("device").textContent = `Cihaz: ${engines.device.toUpperCase()}`;
      updateCounter();
    }

    function setPill(status) {
      const pill = $("pill");
      pill.textContent = STATUS_TEXT[status] || status;
      pill.className = `pill ${status}`;
    }

    function renderJob(job) {
      setPill(job.status);
      const percent = job.percent || 0;
      $("bar").style.width = `${percent}%`;
      $("percent").textContent = `%${percent}`;
      $("progress-label").textContent = job.status === "loading" || job.status === "queued"
        ? `${job.total} parça bekliyor`
        : `${job.done} / ${job.total} parça`;
      $("elapsed").textContent = formatDuration(job.elapsed_seconds);
      $("remaining").textContent = job.status === "running" && job.remaining_seconds !== null
        ? `~${formatDuration(job.remaining_seconds)}`
        : job.status === "done" ? "0 sn" : "-";
      $("engine-name").textContent = job.engine === "xtts" ? "XTTS v2" : "Piper";
      $("lang-name").textContent = languages[job.lang] || job.lang;
    }

    function startTimer() {
      stopTimer();
      timer = setInterval(() => {
        if (!activeJobId) return;
        pollJob(activeJobId);
      }, 1000);
    }

    function stopTimer() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    async function pollJob(jobId) {
      const res = await fetch(`/api/jobs/${jobId}`);
      if (!res.ok) {
        finishWithError("İş bilgisi alınamadı.");
        return;
      }
      const job = await res.json();
      if (jobId !== activeJobId) return;
      renderJob(job);
      if (job.status === "done") {
        await finishJob(job);
      } else if (job.status === "error") {
        finishWithError(job.error || "Ses üretilemedi.");
      }
    }

    async function finishJob(job) {
      stopTimer();
      activeJobId = null;
      setButtonBusy(false);
      const url = `/api/jobs/${job.id}/audio`;
      const player = $("player");
      player.src = url;
      player.classList.remove("hidden");
      const link = $("download");
      link.href = url;
      link.download = job.output_name || "ses.wav";
      $("actions").classList.remove("hidden");
      $("error").classList.add("hidden");
      addHistory(job, url);
    }

    function finishWithError(message) {
      stopTimer();
      activeJobId = null;
      setButtonBusy(false);
      setPill("error");
      const box = $("error");
      box.textContent = message;
      box.classList.remove("hidden");
    }

    function setButtonBusy(busy) {
      $("speak").disabled = busy;
      $("speak").textContent = busy ? "Üretiliyor..." : "Üret";
    }

    function addHistory(job, url) {
      history.unshift({ url, name: job.output_name, lang: languages[job.lang] || job.lang, engine: job.engine, elapsed: job.elapsed_seconds });
      history.splice(10);
      const container = $("history");
      container.innerHTML = "";
      for (const item of history) {
        const row = document.createElement("div");
        row.className = "history-item";
        const info = document.createElement("div");
        info.innerHTML = `<div>${item.lang} · ${item.engine === "xtts" ? "XTTS v2" : "Piper"}</div><div class="muted">${item.name} · ${formatDuration(item.elapsed)}</div>`;
        const play = document.createElement("button");
        play.className = "ghost";
        play.textContent = "Dinle";
        play.addEventListener("click", () => {
          $("player").src = item.url;
          $("player").classList.remove("hidden");
          $("player").play();
        });
        row.append(info, play);
        container.append(row);
      }
      $("history-card").classList.remove("hidden");
    }

    async function speak() {
      if (activeJobId) return;
      const text = $("text").value.trim();
      if (!text) {
        alert("Lütfen bir metin girin.");
        return;
      }
      if (text.length > maxTextLength) {
        alert(`Metin en fazla ${maxTextLength.toLocaleString("tr-TR")} karakter olabilir.`);
        return;
      }

      $("status-card").classList.remove("hidden");
      $("error").classList.add("hidden");
      $("player").classList.add("hidden");
      $("actions").classList.add("hidden");
      setButtonBusy(true);
      setPill("queued");
      $("bar").style.width = "0%";
      $("percent").textContent = "%0";
      $("progress-label").textContent = "Hazırlanıyor...";
      $("elapsed").textContent = "-";
      $("remaining").textContent = "-";

      try {
        const res = await fetch("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, lang: $("lang").value, engine: $("engine").value }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(typeof body.detail === "string" ? body.detail : `İstek hatası (${res.status}).`);
        }
        const job = await res.json();
        activeJobId = job.id;
        renderJob(job);
        startTimer();
      } catch (err) {
        finishWithError(err.message);
      }
    }

    $("speak").addEventListener("click", speak);
    $("text").addEventListener("input", updateCounter);
    $("text").addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key === "Enter") speak();
    });

    loadOptions().catch((err) => finishWithError("Sunucuya bağlanılamadı: " + err.message));
  </script>
</body>
</html>
